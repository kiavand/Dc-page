
name: reel-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Telegram configuration
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing or empty."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing or empty."
            exit 1
          fi

          echo "Telegram secrets are available."

      - name: Poll Telegram messages
        id: poll
        run: python bot.py poll

      - name: Install FFmpeg
        if: steps.poll.outputs.jobs != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Chromium and dependencies
        if: steps.poll.outputs.jobs != '0'
        run: |
          python -m playwright install --with-deps chromium

      - name: Build and send reel
        if: steps.poll.outputs.jobs != '0'
        run: python bot.py build

      - name: Save polling state
        if: always() && steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"

          git add state/offset.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Telegram polling state"
          git push
