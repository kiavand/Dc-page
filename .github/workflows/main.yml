name: reel-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN"; exit 1;[span_0](start_span)[span_0](end_span) }

      - name: Poll Telegram messages
        id: poll
        run: python bot.py poll

      - name: Install FFmpeg and Chromium
        if: steps.poll.outputs.jobs != '0' || hashFiles('work/job_*.txt') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium

      - name: Build and send reels
        if: steps.poll.outputs.jobs != '0' || hashFiles('work/job_*.txt') != ''
        run: python bot.py build

      - name: Save polling state and pending jobs
        if: always() && (steps.poll.outputs.changed == 'true' || hashFiles('work/job_*.txt') != '')
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A state work
          if git diff --cached --quiet; then
            echo "No state or queue changes to commit."
            exit 0
          fi
          git commit -m "Save Telegram polling state and reel queue"
          git push
